name: Verify

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit
    # Push covers same-repo branches. pull_request runs only for forks, so a PR is not tested twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build for testing
        id: build
        run: >
          xcodebuild build-for-testing
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -configuration Debug
          -derivedDataPath DerivedData
          CODE_SIGN_IDENTITY=-

      # These two suites show real windows and time them, so they run alone after the rest.
      - name: Run unit tests in parallel
        run: >
          xcodebuild test-without-building
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          -resultBundlePath ParallelResults.xcresult
          -parallel-testing-enabled YES
          -skip-testing:CompositorTests/FloatingPanelTests
          -skip-testing:CompositorTests/SliderSnapTests

      - name: Run window tests serially
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          xcodebuild test-without-building
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          -resultBundlePath SerialResults.xcresult
          -parallel-testing-enabled NO
          -only-testing:CompositorTests/FloatingPanelTests
          -only-testing:CompositorTests/SliderSnapTests

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: "*.xcresult"
          retention-days: 7
          if-no-files-found: ignore

  # A version tag (v1.4.6) publishes an ad-hoc signed disk image on that GitHub Release.
  # The tag name has to match MARKETING_VERSION, which is the name of the image.
  release:
    name: release
    needs: unit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build the disk image
        run: zsh ./scripts/package-local.sh

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dmg="dist/Compositor-${version}.dmg"
          if [[ ! -f "$dmg" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match MARKETING_VERSION. Expected dist/Compositor-${version}.dmg."
            ls -1 dist || true
            exit 1
          fi
          notes_file="release-notes/${version}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "Missing ${notes_file}. Write that file and include it in the tagged commit."
            exit 1
          fi
          title=$(head -n 1 "$notes_file")
          body=$(tail -n +2 "$notes_file" | sed '/./,$!d')
          notes=$(printf '%s\n\n%s\n' "$body" "在较新的 macOS 上打开前，系统会询问。请右键点 Compositor，选择「打开」，或到「系统设置 → 隐私与安全性」里允许这一次。替换「应用程序」里的副本即可，已有项目不会被改动。

---

<sub><em>Automatically published by the <code>publish-release</code> skill.</em></sub>")
          gh release create "$GITHUB_REF_NAME" "$dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes "$notes"
